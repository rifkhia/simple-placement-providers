server {
    listen 80;
    # Replace with the hostname of the VM serving this app, or leave as `_`
    # to accept any Host header.
    server_name _;

    # ── Test environment → container on port 3001 ─────────────────────────────
    location /test/ {
        proxy_pass         http://localhost:3001/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /test {
        return 301 /test/;
    }

    # ── Prod environment → container on port 3002 ─────────────────────────────
    location /prod/ {
        proxy_pass         http://localhost:3002/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /prod {
        return 301 /prod/;
    }
}
