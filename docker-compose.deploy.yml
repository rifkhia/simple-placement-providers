# Deployment compose file — lives on the VM, pulls prebuilt images from GHCR.
# No `build:` section: images come from the Deploy workflow.
#
# IMAGE_REPO is exported by the deploy workflow (e.g. ghcr.io/owner/repo).
# IMAGE_TAG defaults to `latest`; set it to a commit SHA to pin or roll back:
#   IMAGE_TAG=<sha> docker compose -f docker-compose.deploy.yml up -d
#
# .env.test and .env.prod must exist alongside this file — they hold the API
# URL and Basic Auth credentials and are deliberately not in the repo.
services:
  test:
    image: ${IMAGE_REPO:?IMAGE_REPO is not set}:test-${IMAGE_TAG:-latest}
    ports:
      - "3001:4173"
    env_file:
      - .env.test
    restart: unless-stopped

  prod:
    image: ${IMAGE_REPO:?IMAGE_REPO is not set}:prod-${IMAGE_TAG:-latest}
    ports:
      - "3002:4173"
    env_file:
      - .env.prod
    restart: unless-stopped
