name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't let two deploys race on the VM; cancel-in-progress is off so an
# in-flight deploy finishes rather than leaving compose half-updated.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.env }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # VITE_BASE_PATH is baked in at build time, so each environment needs
          # its own image. Runtime config (API URL, credentials) is NOT in the
          # image — it comes from .env.test / .env.prod on the VM.
          - env: test
            base_path: /test
          - env: prod
            base_path: /prod
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase image path; github.repository may not be.
      - name: Resolve image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_BASE_PATH=${{ matrix.base_path }}
          # <env>-latest is what the VM pulls by default; <env>-<sha> is the
          # immutable tag to pin to when rolling back.
          tags: |
            ${{ steps.image.outputs.name }}:${{ matrix.env }}-latest
            ${{ steps.image.outputs.name }}:${{ matrix.env }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.env }}
          cache-to: type=gha,mode=max,scope=${{ matrix.env }}

  deploy:
    name: Deploy to VM
    needs: build
    runs-on: ubuntu-latest
    # Requires a "production" environment in repo settings; add required
    # reviewers there to gate deploys, or remove this line to always deploy.
    environment: production
    steps:
      - name: Resolve image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Third-party action — consider pinning to a commit SHA rather than a tag.
      - name: docker compose pull && up
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stops: true
          envs: IMAGE_REPO,IMAGE_TAG,DEPLOY_PATH,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:?DEPLOY_PATH repo variable is not set}"

            # Only needed while the GHCR package is private. Make the package
            # public and you can drop this line and the GHCR_PULL_TOKEN secret.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Interpolated into docker-compose.deploy.yml
            export IMAGE_REPO IMAGE_TAG

            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            docker compose -f docker-compose.deploy.yml ps
            docker image prune -f
        env:
          IMAGE_REPO: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
