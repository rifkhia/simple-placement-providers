name: Build & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.env }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - env: test
            base_path: /test
          - env: prod
            base_path: /prod
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_BASE_PATH=${{ matrix.base_path }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ matrix.env }}-latest
            ${{ steps.image.outputs.name }}:${{ matrix.env }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.env }}
          cache-to: type=gha,mode=max,scope=${{ matrix.env }}

      - name: Summary
        run: |
          {
            echo "### Pushed \`${{ matrix.env }}\`"
            echo ""
            echo '- `${{ steps.image.outputs.name }}:${{ matrix.env }}-latest`'
            echo '- `${{ steps.image.outputs.name }}:${{ matrix.env }}-${{ github.sha }}`'
            echo ""
            echo "Watchtower on the VM polls \`${{ matrix.env }}-latest\` every 120s and"
            echo "recreates the container — expect it live within ~2 minutes."
          } >> "$GITHUB_STEP_SUMMARY"
